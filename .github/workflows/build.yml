name: build

# Builds the driver in two flavours:
#   linux    aarch64 glibc Linux  -> DroidDeck
#   android  Android/bionic, AdrenoTools package -> GameHub, GameNative
# Triggers:
#  - every push to main / pull request: build and keep the packages as artifacts
#  - a pushed tag r<N>, or a release r<N> published from the web UI:
#    build and attach both zips to that release (notes are filled in when empty)
#  - manual run from the Actions tab: build with an optional name
on:
  push:
    branches: [main]
    tags: ['r*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      name:
        description: 'Name used in the zip (default: git describe)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        id: build
        run: |
          NAME="${{ inputs.name }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then NAME="${GITHUB_REF_NAME}"; fi
          set -o pipefail
          if ! a8xx/build.sh --deps --target ${{ matrix.target }} ${NAME} > build.log 2>&1; then
            echo "::error title=build failed::$(tail -60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          ZIP=$(tail -1 build.log)
          PKG=$(basename "$ZIP" .zip)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          # GitHub always zips artifacts, so upload unpacked files: the
          # downloaded artifact then has the same layout as the release zip.
          # linux: keep the top-level folder; android: files at the top level.
          mkdir -p artifact
          if [[ "${{ matrix.target }}" == linux ]]; then
            cp -r "out/$PKG" artifact/
          else
            cp -r "out/$PKG"/. artifact/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg }}
          path: artifact/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/r')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          a8xx/release-notes.sh "$TAG" > notes.md
          ZIP="${{ steps.build.outputs.zip }}"
          # Both matrix jobs may race to create the release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file notes.md --verify-tag ||
              gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release upload "$TAG" "$ZIP" --clobber
            if [[ -z "$(gh release view "$TAG" --json body --jq .body)" ]]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          fi
