name: publish-history

# One-time (re-runnable) job, started by hand from the Actions tab:
#  1. creates the tags r7..r54 listed in a8xx/tags.txt (skips existing ones)
#  2. rebuilds the chosen ones from source (linux + android/AdrenoTools)
#     and publishes them as releases
# Old commits predate a8xx/, so the build script and notes come from main.
on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Tags to build and release ("all" or space-separated, e.g. "r50 r51 r52 r53 r54")'
        required: true
        default: 'r50 r51 r52 r53 r54'

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      # The tagged commits still contain upstream Mesa's macos.yml, and GitHub
      # refuses refs that change workflow files unless the token has the
      # "workflows" permission, which GITHUB_TOKEN never has. Tags are
      # therefore pushed with a personal token stored as secret TAG_TOKEN.
      - name: Check TAG_TOKEN
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
        run: |
          if [[ -z "$TAG_TOKEN" ]]; then
            echo "::error title=TAG_TOKEN missing::Add a token with Contents + Workflows write access as repository secret TAG_TOKEN (see README)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_TOKEN }}
      - name: Create tags
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          fail=0
          while read -r tag sha; do
            [[ -z "$tag" || "$tag" == \#* ]] && continue
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag exists"; continue
            fi
            git tag -f "$tag" "$sha" >/dev/null
            if out=$(git push origin "refs/tags/$tag" 2>&1); then
              echo "$tag -> $sha"
            else
              fail=1
              echo "::error title=tag $tag::$(echo "$out" | tail -5 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            fi
          done < a8xx/tags.txt
          exit $fail
      - name: Release list
        id: list
        run: |
          want="${{ inputs.releases }}"
          if [[ "$want" == all ]]; then want=$(grep -v '^#' a8xx/tags.txt | awk '{print $1}'); fi
          echo "matrix=$(printf '%s\n' $want | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  release:
    needs: tags
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJson(needs.tags.outputs.matrix) }}
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the tagged source, keep a8xx/ tooling from main
        run: |
          cp -r a8xx /tmp/a8xx
          git checkout -q "${{ matrix.tag }}"
          rm -rf a8xx && cp -r /tmp/a8xx a8xx
      - name: Build
        id: build
        run: |
          set -o pipefail
          if ! a8xx/build.sh --deps --target ${{ matrix.target }} "${{ matrix.tag }}" > build.log 2>&1; then
            echo "::error title=build failed::$(tail -60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "zip=$(tail -1 build.log)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.tag }}"
          ZIP="${{ steps.build.outputs.zip }}"
          a8xx/release-notes.sh "$TAG" > notes.md
          printf '\nRebuilt from source by GitHub Actions.\n' >> notes.md
          NEWEST=$(grep -v '^#' a8xx/tags.txt | awk '{print $1}' | sort -V | tail -1)
          LATEST=false; [[ "$TAG" == "$NEWEST" ]] && LATEST=true
          # linux and android jobs of the same tag may race to create it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file notes.md \
              --verify-tag --latest=$LATEST || gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release upload "$TAG" "$ZIP" --clobber
          fi
